name: PSX Paper Bot

on:
  schedule:
    - cron: "30 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-psx-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PSX paper bot
        env:
          PSX_TELEGRAM_BOT_TOKEN: ${{ secrets.PSX_TELEGRAM_BOT_TOKEN }}
          PSX_TELEGRAM_CHAT_ID: ${{ secrets.PSX_TELEGRAM_CHAT_ID }}
        run: python main.py

      - name: Commit bot state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio.json history/*.json
          git diff --cached --quiet || git commit -m "Update PSX paper bot state"
          git push
